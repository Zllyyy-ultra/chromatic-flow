<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a14"><meta name="description" content="Chromatic Flow — 离线可用的三维粒子波浪音乐壁纸">
<title>Chromatic Flow · V0.3</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=0.3">
</head>
<body>
<canvas id="scene" aria-label="随音乐舒展的三维彩色粒子波浪"></canvas>
<header id="brand"><span class="mark">CF</span><div>CHROMATIC FLOW<small>粒子之间，流动的光。 / V0.3</small></div></header>
<button id="reveal" aria-label="显示控制面板">调节</button>
<aside id="panel" aria-label="壁纸设置">
<div class="heading"><span>FLOW STUDIO</span><button id="hide" aria-label="隐藏控制面板">×</button></div>
<h1>光，没有固定形状。</h1><p>流光 · 旋涡 · 星云，缓缓交融。</p>
<div id="status" role="status">● 舒缓流动 · 无音频输入</div>
<div class="selectors">
<label for="formation">粒子形态</label><select id="formation"><option value="0">自动漫游</option><option value="1">流光丝带</option><option value="2">星际旋涡</option><option value="3">漂浮星云</option></select>
<label for="palette">流动配色</label><select id="palette"><option value="0">自动变幻</option><option value="1">极光 · 青紫</option><option value="2">落日 · 金粉</option><option value="3">深海 · 冰蓝</option><option value="4">绯梦 · 玫紫</option></select>
<label for="particle">粒子外观</label><select id="particle"><option value="0">柔光微尘</option><option value="1">闪烁星芒</option><option value="2">空灵光环</option></select>
</div>
<label for="spread">空间舒展 <output id="spread-value">55%</output></label><input id="spread" type="range" min="0" max="100" value="55">
<label for="colorSpeed">色彩流速 <output id="colorSpeed-value">40%</output></label><input id="colorSpeed" type="range" min="0" max="100" value="40">
<label for="sensitivity">音乐响应 <output id="sensitivity-value">65%</output></label><input id="sensitivity" type="range" min="0" max="100" value="65">
<details><summary>更多调节</summary>
<label for="velocity">流动速度 <output id="velocity-value">35%</output></label><input id="velocity" type="range" min="0" max="100" value="35">
<label for="brightness">光的亮度 <output id="brightness-value">60%</output></label><input id="brightness" type="range" min="0" max="100" value="60">
<label for="density">粒子密度 <output id="density-value">中</output></label><input id="density" type="range" min="0" max="2" step="1" value="1">
</details>
<button id="demo" aria-pressed="false">▷ 模拟音乐预览</button>
<div class="actions"><button id="fullscreen">全屏</button><button id="pause" aria-pressed="false">暂停</button></div>
<small class="hint">H 收起面板 · F 全屏 · 空格暂停<br>模拟频谱，无声音播放或录制。</small>
</aside>
<footer id="info"><span>GENERATIVE LIGHT / LOCAL & OFFLINE</span><span id="metrics">GPU PARTICLE FIELD</span></footer>
<div id="error" role="alert" hidden></div>
<script src="audio.js?v=0.3"></script><script src="evolution.js?v=0.3"></script><script src="app.js?v=0.3"></script>
</body>
</html>
